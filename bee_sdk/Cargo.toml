[package]
name = "bee-sdk"
version.workspace = true
license.workspace = true
edition.workspace = true
# wasm-pack copies this into pkg/package.json's `repository`; npm provenance
# (OIDC trusted publishing) rejects the publish unless it matches the source repo.
repository = "https://github.com/gosh-sh/bee-engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bee-connect = { path = "../bee_connect", default-features = false, features=["single-wasm"] }
bee-crypto = { path = "../bee_crypto", default-features = false, features=["single-wasm"] }
bee-miner = { path = "../bee_miner", default-features = false, features=["single-wasm"] }
bee-wallet = { path = "../bee_wallet", default-features = false, features=["single-wasm"] }
