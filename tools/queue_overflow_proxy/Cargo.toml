[package]
name = "queue-overflow-proxy"
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
axum = "0.8"
blake3.workspace = true
clap = { version = "4.6", features = ["derive"] }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json.workspace = true
tokio = { version = "1.49", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
ackinacki-kit = { git = "https://github.com/gosh-sh/ackinacki-kit.git", rev = "d03d2cb83eaf2aef77a104f6f0e2d0febfde4b26", default-features = false, features = ["contracts"] }
bee-infra = { path = "../../bee_infra", features = ["message-delivery", "tokio"] }
