name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: check-workspace
            command: cargo check --workspace --exclude bee-verifier
          - name: check-verifier
            command: cargo check -p bee-verifier
          - name: check-miner-wasm-feature
            command: cargo check -p bee-miner --no-default-features --features wasm
          - name: clippy-workspace
            command: cargo clippy --workspace --all-targets -- -D warnings
          - name: test-workspace-native
            command: cargo test --workspace --exclude bee-verifier --exclude bee-sdk
          - name: test-verifier-lib
            command: cargo test -p bee-verifier --lib
          - name: test-miner-wasm-feature
            command: cargo test -p bee-miner --no-default-features --features wasm --lib
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: target
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
